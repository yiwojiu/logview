[package]
name = "logview"
version = "0.1.12"
edition = "2021"
description = "Cross-platform viewer for huge log files, built with egui"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/yiwojiu/logview"
keywords = ["log", "viewer", "gui", "egui", "tail"]
categories = ["gui", "visualization"]

[[bin]]
name = "logview"
path = "src/main.rs"

[dependencies]
egui = "0.31"
memmap2 = "0.9"
memchr = "2"
encoding_rs = "0.8"
rfd = "0.15"
anyhow = "1"
regex = "1"

# 渲染后端按平台分开。
#
# Windows 走 wgpu + D3D12 而不是默认的 glow（OpenGL）：glow 需要 OpenGL 3.2+，
# 而远程桌面会话的显示驱动通常只提供 OpenGL 1.1——上下文创建失败，窗口根本建不起来。
# 对日志查看器来说这是硬伤：这类工具最常见的用法就是在服务器上跑，而服务器基本没有独显。
# D3D12 在远程桌面下可用（RDP 支持 D3D 加速，没有硬件卡时还能回退软件渲染）。
# 其余平台保持 glow：macOS 与 Linux 上它已经稳定，没必要为同一个问题多背几 MB。
#
# 另外注意：eframe 0.31 声明 wgpu 时用了 `default-features = false` 且只补了
# `metal` + `webgpu`（见 eframe 自己的 Cargo.toml），**默认集里的 `dx12` 因此被关掉了**。
# 只打开 eframe 的 `wgpu` feature 的话，Windows 上会只剩 Vulkan 与 GLES 两个后端，
# 而远程桌面里 Vulkan 通常也不可用，等于白切。所以把 dx12 显式补上——
# Cargo 的 feature 取并集，与 eframe 的声明不冲突，只需版本与它用的 wgpu 一致。
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }

# Linux：两个后端都编，**默认走 wgpu**（可用 LOGVIEW_RENDERER=glow 换回 OpenGL）。
#
# 原因与 Windows 那条同源：X11 下的 GL 实现不由我们决定。eframe 写死了
# "先试 GLX，失败才退 EGL"（glutin-winit 的 ApiPreference::FallbackEgl），
# 没有环境变量可改。而 GLX 建上下文失败时 glutin 只认服务端返回的 XID，
# 照样当成成功，直到随后的 glXMakeCurrent 才被 X 服务器回 GLXBadContextTag——
# 这个错误是异步投递的，最后被 winit 报成一个来自 XMapRaised 的 panic，
# 还会在 drop 里二次 panic 把进程 abort 掉。远程 X（VNC、远程控制台）上很容易踩到。
# wgpu 在 Linux 走 Vulkan 或 **EGL**，整个 GLES 后端里没有一处 GLX 调用，正好绕开。
# 代价是 Linux 产物多几 MB（实测 15.6 → 20.1 MB）。
#
# 注意 winit 不允许重建 event loop（第二次创建直接返回 RecreationAttempt），
# 所以做不到"一个后端失败再试另一个"——默认值必须一次选对。
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wgpu",
    "wayland",
    "x11",
] }

# macOS：只保留 glow。那边它一直正常，没必要多背几 MB 的 wgpu
[target.'cfg(all(not(windows), not(target_os = "linux")))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[dev-dependencies]
encoding_rs = "0.8"

[profile.release]
opt-level = 2
