name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 的 Apple Silicon 机器
          - os: macos-latest
            target: aarch64-apple-darwin
          # macOS 的 Intel 机器（在 arm runner 上交叉编译）
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Linux 暂不发布预编译产物（v0.1.12 起）。前几版都卡在 GLX/EGL 上，
          # 在没确认能打开之前，发一个起不来的包只会让下载的人白折腾。
          # 代码本身仍然支持 Linux —— CI 三个平台都在编译与测试 —— 要恢复 Linux 包，
          # 把这行加回来即可：
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 压缩包名里带版本号（`logview-v0.1.9-x86_64-pc-windows-msvc.zip`）：下载到本地后
      # 堆几个版本也能一眼分清新旧。v0.1.8 及更早叫 `logview-x86_64-pc-windows-msvc.zip`，
      # 不带版本，出现过"拿着旧包以为是最新版"的误会。所以每个目标都要读到版本号
      # （Windows 上这段由 Git Bash 执行）。
      - name: 读取版本号（并校验与标签一致）
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION"

          # 包名带版本号之后，标签与 Cargo.toml 不一致反而更误导（下载页写着 v0.2.0，
          # 里面的文件名却是 0.1.9），所以在这里挡住。workflow_dispatch 没有标签，跳过。
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 Cargo.toml 的 v${VERSION} 不一致，先改 Cargo.toml 再打标签"
            exit 1
          fi

      # macOS 必须打成 .app：Finder 遇到裸二进制会交给终端执行，
      # 双击就会弹出一个终端窗口，而 Windows 靠 PE 头部标记解决这个问题。
      #
      # 两个平台都在压缩包里套一层与压缩包同名的目录：解压不会把文件散在当前目录里，
      # 几个版本解压到同一个下载目录也不会互相覆盖。
      - name: 打包（macOS，包成 .app）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash assets/make-app.sh \
            "target/${{ matrix.target }}/release/logview" \
            "." \
            "${{ steps.ver.outputs.value }}"
          NAME="logview-v${{ steps.ver.outputs.value }}-${{ matrix.target }}"
          # 用 mv 而不是 cp：同一个文件系统内移动会原样保留符号链接、扩展属性与签名
          mkdir -p "$NAME"
          mv logview.app "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          rm -rf "$NAME"
          echo "产物大小：$(du -h "$NAME.tar.gz" | cut -f1)"

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "logview-v${{ steps.ver.outputs.value }}-${{ matrix.target }}"
          # 用 + 拼接而不是 "$name.zip"：双引号里 "$name.zip" 会被当作属性访问尝试，
          # 语义随 PowerShell 版本和变量类型而变，显式拼接没有这层歧义
          $zip = $name + ".zip"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/logview.exe $stage
          # 压缩整个目录，压缩包里就会带上这一层
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: logview-${{ matrix.target }}
          path: logview-v${{ steps.ver.outputs.value }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256 校验和
        working-directory: dist
        run: |
          # 只列压缩包。原先写的 `sha256sum *` 能否避开把自己（SHA256SUMS.txt）
          # 也算进去，取决于重定向与通配展开的先后——显式写 logview-* 不依赖这个细节
          sha256sum logview-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
