name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 的 Apple Silicon 机器
          - os: macos-latest
            target: aarch64-apple-darwin
          # macOS 的 Intel 机器（在 arm runner 上交叉编译）
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装 Linux 图形库依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # Linux 产物的 glibc 底线是**构建机**决定的：ubuntu-latest 现在是 Ubuntu 24.04
      # （glibc 2.39），编出来的二进制会硬要求 GLIBC_2.39 等符号，于是
      # CentOS/RHEL 8（2.28）、Ubuntu 22.04（2.35）这类机器上直接
      # `GLIBC_2.xx not found` 起不来——看着像"文件坏了"，其实是构建环境太新。
      #
      # 用 zig 当链接器把目标钉在 **glibc 2.17**（rustc 支持的最低底线，
      # 覆盖 CentOS/RHEL 7+、Debian 8+、Ubuntu 14.04+）。zig 自带各版本 glibc 的桩，
      # 所以不需要一台旧机器也能编出旧 glibc 的产物。Windows / macOS 不受影响。
      - name: 安装 zig（只有 Linux 产物需要）
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: 安装 cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild

      - name: 构建
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 构建（Linux，glibc 钉在 2.17）
        if: runner.os == 'Linux'
        run: |
          cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.17
          # cargo-zigbuild 会把 `.2.17` 后缀去掉，产物仍在 target/<三元组>/release/ 下。
          # 仍用 find 兜一层：万一将来路径变了，也好过静默打包上一个旧文件。
          BIN=$(find target -maxdepth 3 -type f -name logview -path '*/release/*' | head -1)
          echo "zigbuild 产物：$BIN"
          WANT=target/x86_64-unknown-linux-gnu/release/logview
          if [ "$BIN" != "$WANT" ]; then cp "$BIN" "$WANT"; fi

      # 光"钉住了"不够，还得能证明。这道检查让底线上抬时**构建失败**而不是发布出去——
      # 新增一个用上新符号的依赖就会悄悄抬高它，而后果只在别人的旧机器上才看得到。
      - name: 校验 Linux 产物的 glibc 需求
        if: runner.os == 'Linux'
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/logview
          test -f "$BIN" || { echo "::error::没找到 $BIN"; exit 1; }
          # 注意去掉 GLIBC_ 前缀再排序比较：带着前缀时 'GLIBC_2.17' 会被排到 '2.17' 之后，
          # 于是合格输入也会被判成不合格（本地干跑就是这么抓出来的）
          REQ=$(readelf --version-info "$BIN" | grep -o 'GLIBC_[0-9.]\+' | sed 's/^GLIBC_//' | sort -Vu | tr '\n' ' ')
          MAX=$(echo "$REQ" | tr ' ' '\n' | grep . | tail -1)
          echo "产物要求的 glibc：$REQ"
          echo "最高：$MAX（允许到 2.17）"
          if [ "$(printf '%s\n2.17\n' "$MAX" | sort -V | tail -1)" != "2.17" ]; then
            echo "::error::产物要求 glibc $MAX，高于约定的 2.17，会在旧发行版上起不来"
            exit 1
          fi

      # 压缩包名里带版本号（`logview-v0.1.9-x86_64-pc-windows-msvc.zip`）：下载到本地后
      # 堆几个版本也能一眼分清新旧。v0.1.8 及更早叫 `logview-x86_64-pc-windows-msvc.zip`，
      # 不带版本，出现过"拿着旧包以为是最新版"的误会。所以四个平台都要读到版本号
      # （Windows 上这段由 Git Bash 执行）。
      - name: 读取版本号（并校验与标签一致）
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION"

          # 包名带版本号之后，标签与 Cargo.toml 不一致反而更误导（下载页写着 v0.2.0，
          # 里面的文件名却是 0.1.9），所以在这里挡住。workflow_dispatch 没有标签，跳过。
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 Cargo.toml 的 v${VERSION} 不一致，先改 Cargo.toml 再打标签"
            exit 1
          fi

      # macOS 必须打成 .app：Finder 遇到裸二进制会交给终端执行，
      # 双击就会弹出一个终端窗口，而 Windows 靠 PE 头部标记解决这个问题
      - name: 打包（macOS，包成 .app）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash assets/make-app.sh \
            "target/${{ matrix.target }}/release/logview" \
            "." \
            "${{ steps.ver.outputs.value }}"
          NAME="logview-v${{ steps.ver.outputs.value }}-${{ matrix.target }}"
          tar -czf "$NAME.tar.gz" logview.app
          echo "产物大小：$(du -h "$NAME.tar.gz" | cut -f1)"

      # Linux 的"程序图标"不在可执行文件里（不像 Windows 的 PE 资源、macOS 的 .app），
      # 而是系统里的一份独立文件：`.desktop` 启动项 + hicolor 主题下的 PNG。
      # 所以这两样得跟着产物一起发，否则只有运行时的窗口图标（X11 下走 _NET_WM_ICON），
      # 而 Wayland 下合成器要靠 .desktop 匹配 app_id，缺了它就是默认图标。
      - name: 打包（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          NAME="logview-v${{ steps.ver.outputs.value }}-${{ matrix.target }}"
          STAGE=$(mktemp -d)
          install -Dm755 target/${{ matrix.target }}/release/logview "$STAGE/logview"
          install -Dm644 assets/logview.desktop "$STAGE/logview.desktop"
          for s in 16 32 64 128 256 512; do
            install -Dm644 "assets/icon-$s.png" \
              "$STAGE/icons/hicolor/${s}x${s}/apps/logview.png"
          done
          tar -czf "$NAME.tar.gz" -C "$STAGE" logview logview.desktop icons
          echo "产物大小：$(du -h "$NAME.tar.gz" | cut -f1)"
          tar -tzf "$NAME.tar.gz" | sed 's/^/  /'

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "logview-v${{ steps.ver.outputs.value }}-${{ matrix.target }}"
          # 用 + 拼接而不是 "$name.zip"：双引号里 "$name.zip" 会被当作属性访问尝试，
          # 语义随 PowerShell 版本和变量类型而变，显式拼接没有这层歧义
          $zip = $name + ".zip"
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/logview.exe `
            -DestinationPath $zip `
            -Force
          Get-Item $zip | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: logview-${{ matrix.target }}
          path: logview-v${{ steps.ver.outputs.value }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256 校验和
        working-directory: dist
        run: |
          # 只列压缩包。原先写的 `sha256sum *` 能否避开把自己（SHA256SUMS.txt）
          # 也算进去，取决于重定向与通配展开的先后——显式写 logview-* 不依赖这个细节
          sha256sum logview-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
